name: Android Preview APK

on:
  workflow_dispatch:
  pull_request:
    branches: [claude-code]
    paths:
      - '.github/workflows/android-preview.yml'
      - 'app/**'
      - 'assets/**'
      - 'src/**'
      - 'scripts/verify-native-config.mjs'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: android-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules
          df -h /

      - name: Install dependencies
        run: npm ci

      - name: Generate native projects
        run: npx expo prebuild --no-install --clean

      - name: Verify native privacy config
        run: node scripts/verify-native-config.mjs

      - name: Limit Android architectures
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,x86_64/' android/gradle.properties
          grep reactNativeArchitectures android/gradle.properties

      - name: Build preview APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: ihvan-preview-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download preview APK
        uses: actions/download-artifact@v4
        with:
          name: ihvan-preview-apk

      - name: Configure KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            adb install app-release.apk
            adb logcat -c
            adb shell monkey -p com.ihvan.quran -c android.intent.category.LAUNCHER 1
            sleep 30
            mkdir -p screenshots
            adb exec-out screencap -p > screenshots/01-onboarding.png
            adb shell input tap 540 2112
            sleep 5
            adb exec-out screencap -p > screenshots/02-today.png
            adb shell am start -W -a android.intent.action.VIEW -d "ihvan://quran" com.ihvan.quran >/dev/null
            sleep 3
            adb exec-out screencap -p > screenshots/03-quran.png
            adb shell am start -W -a android.intent.action.VIEW -d "ihvan://worship" com.ihvan.quran >/dev/null
            sleep 3
            adb exec-out screencap -p > screenshots/04-worship.png
            adb shell am start -W -a android.intent.action.VIEW -d "ihvan://journal" com.ihvan.quran >/dev/null
            sleep 3
            adb exec-out screencap -p > screenshots/05-journal.png
            adb shell am start -W -a android.intent.action.VIEW -d "ihvan://profile" com.ihvan.quran >/dev/null
            sleep 3
            adb exec-out screencap -p > screenshots/06-profile.png
            adb shell am start -W -a android.intent.action.VIEW -d "ihvan://paywall" com.ihvan.quran >/dev/null
            sleep 3
            adb exec-out screencap -p > screenshots/07-paywall.png
            test "$(find screenshots -name '*.png' -size +50000c | wc -l)" -eq 7
            test "$(sha256sum screenshots/*.png | awk '{print $1}' | sort -u | wc -l)" -ge 4
            adb logcat -d > logcat.txt
            adb shell pidof com.ihvan.quran
            ! grep -Eq "FATAL EXCEPTION|Fatal signal|tombstoned" logcat.txt

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ihvan-preview-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ihvan-preview-logcat
          path: logcat.txt
          if-no-files-found: ignore
          retention-days: 14
