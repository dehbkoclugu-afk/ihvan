name: Quality

on:
  pull_request:
    branches: [claude-code]
  push:
    branches: [claude-code]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Expo doctor
        run: npx expo-doctor@1.20.1

      - name: Validate Expo config
        run: npx expo config --type public > /dev/null

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Export web
        run: npx expo export --platform web

      - name: Prebuild native configs
        run: npx expo prebuild --no-install --clean

      - name: Verify native privacy config
        run: node scripts/verify-native-config.mjs
